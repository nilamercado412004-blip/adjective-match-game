<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Adjective Match Table</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:#b87945;
    color:#4a2c18;
    overflow-x:hidden;
}

/* HEADER */

header{
    background:#fff8e8;
    text-align:center;
    padding:16px 10px;
    border-bottom:4px solid #9a6236;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

h1{
    margin:0;
    font-size:clamp(28px,7vw,46px);
}

.subtitle{
    margin-top:5px;
    font-size:18px;
}

.score{
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.badge{
    background:white;
    padding:8px 18px;
    border-radius:20px;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

/* TABLE */

#table{
    position:relative;
    min-height:calc(100vh - 140px);
    padding:25px;
    background-color:#ad713e;

    background-image:
    repeating-linear-gradient(
        90deg,
        rgba(80,40,10,.07) 0,
        rgba(80,40,10,.07) 2px,
        transparent 2px,
        transparent 90px
    );
}

/* TITLE */

.section-title{
    text-align:center;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 3px #43230f;
    margin-bottom:15px;
}

/* BOARD */

.board{
    position:relative;
    max-width:1150px;
    margin:auto;
    min-height:620px;
}

/* SVG LINES */

#connections{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
}

.connection{
    stroke:#5f3bff;
    stroke-width:5;
    stroke-linecap:round;
    fill:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation:drawLine .6s ease forwards;
}

@keyframes drawLine{
    to{
        stroke-dashoffset:0;
    }
}

/* COLUMNS */

.flashcards,
.adjectives{
    position:absolute;
    top:0;
    width:270px;
    z-index:5;
}

.flashcards{
    left:0;
}

.adjectives{
    right:0;
}

/* LABEL */

.column-title{
    text-align:center;
    background:#fff6d5;
    padding:9px;
    border-radius:18px;
    font-weight:bold;
    margin-bottom:12px;
    box-shadow:0 4px 8px rgba(0,0,0,.2);
}

/* FLASHCARD */

.card{
    width:240px;
    height:135px;
    margin:0 auto 13px;

    background:#fffdf5;

    border:3px solid #d8c8a8;

    border-radius:14px;

    padding:7px;

    box-shadow:
        0 7px 0 #80502e,
        0 10px 16px rgba(40,20,5,.3);

    cursor:grab;

    touch-action:none;
    user-select:none;

    display:flex;
    align-items:center;
    gap:10px;

    position:relative;

    transition:.15s;
}

.card:hover{
    transform:translateY(-4px) rotate(-1deg);
}

.card.dragging{
    position:fixed;
    z-index:10000;
    transform:scale(1.08) rotate(3deg);
    box-shadow:0 20px 30px rgba(0,0,0,.4);
}

.card.matched{
    opacity:.65;
    cursor:default;
}

.photo{
    width:120px;
    height:100px;
    object-fit:cover;
    border-radius:9px;
    background:#ddd;
    pointer-events:none;
}

.card-name{
    font-weight:bold;
    font-size:15px;
    text-align:center;
}

/* ADJECTIVE */

.adjective{
    width:230px;
    height:95px;
    margin:0 auto 53px;

    background:#fff8df;

    border:4px dashed #876746;

    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:27px;
    font-weight:900;

    box-shadow:
        inset 0 0 0 2px white,
        0 6px 12px rgba(0,0,0,.25);

    transition:.2s;

    position:relative;
}

.adjective.active{
    transform:scale(1.07);
    background:#fff09a;
    border-color:#e4a600;
}

.adjective.matched{
    background:#dfffdc;
    border-color:#49a942;
    border-style:solid;
}

.adjective.correct-pulse{
    animation:pulse .5s ease;
}

@keyframes pulse{
    50%{
        transform:scale(1.12);
    }
}

/* POPUP */

#message{
    position:fixed;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%) scale(.7);

    opacity:0;

    pointer-events:none;

    background:white;

    padding:25px 35px;

    border-radius:25px;

    font-size:30px;
    font-weight:bold;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.35);

    z-index:20000;

    transition:.25s;
}

#message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* BUTTON */

.controls{
    text-align:center;
    margin-top:20px;
}

button{
    border:none;
    background:#fff4b5;
    padding:13px 25px;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
    color:#55331c;
    box-shadow:0 5px 0 #80502e;
}

button:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #80502e;
}

/* CONFETTI */

.confetti{
    position:fixed;
    width:10px;
    height:18px;
    top:-20px;
    z-index:30000;
    animation:fall 1.3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh) rotate(720deg);
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:800px){

    #table{
        padding:12px;
    }

    .board{
        min-height:950px;
    }

    .flashcards,
    .adjectives{
        width:48%;
    }

    .flashcards{
        left:0;
    }

    .adjectives{
        right:0;
    }

    .card{
        width:100%;
        height:115px;
    }

    .photo{
        width:75px;
        height:85px;
    }

    .card-name{
        font-size:12px;
    }

    .adjective{
        width:100%;
        height:75px;
        margin-bottom:73px;
        font-size:21px;
    }

}

</style>

</head>

<body>


<header>

<h1>🌈 Adjective Match!</h1>

<div class="subtitle">
Drag the flashcards to the correct adjective.

</header>


<div id="table">

<div class="section-title">
🃏 MATCH THE FLASHCARDS!
</div>


<div class="board">

<svg id="connections"></svg>


<!-- FLASHCARDS -->

<div class="flashcards">

<div class="column-title">
📸 FLASHCARDS
</div>


<div class="card"

data-search="African_bush_elephant">

<img class="photo">

</div>

data-answer="fast"
data-search="Cheetah_walking">

<img class="photo">

</div>


<div class="card"
data-answer="slow"

<img class="photo">

data-search="Palm">

<script>

/* ==================================================
   IMPORTANT:
   AUTOMATICALLY FIND YOUR IMAGES
================================================== */

const imageFiles = [
"African_bush_elephant",
"fe4db989",
"Cheetah_walking",
"Terrapene_carolina",
"Palm",
"cd86cf7e",
"Happy_Child",
"Malachite_cat",
"Mm00a",
"Fir_trees"
];


/*
GitHub doesn't let JavaScript directly
list files in a repository.

So we use the GitHub API to read the
repository contents automatically.
*/

async function loadImages(){

    const path = window.location.pathname;

    const parts = path.split("/");

    const user = parts[1];

    const repo = parts[2];

    const api =
    `https://api.github.com/repos/${user}/${repo}/contents/`;

    try{

        const response =
            await fetch(api);

        const files =
            await response.json();


        document
        .querySelectorAll(".card")
        .forEach(card => {

            const search =
                card.dataset.search
                .toLowerCase();


            const match =
                files.find(file =>
                    file.name
                    .toLowerCase()
                    .includes(search)
                );


            if(match){

                card.querySelector(".photo").src =
                    match.download_url;

            }

        });

    }

    catch(error){

        console.log(
            "Could not automatically load images."
        );

    }

}


/* LOAD PHOTOS */

loadImages();


/* ==================================================
   VARIABLES
================================================== */

let score = 0;

let completed = 0;

let draggedCard = null;

let offsetX = 0;

let offsetY = 0;


const cards =
document.querySelectorAll(".card");

const targets =
document.querySelectorAll(".adjective");

const svg =
document.getElementById("connections");


/* ==================================================
   VOICE
================================================== */

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";

    voice.rate = .85;

    voice.pitch = 1.1;

    speechSynthesis.speak(voice);

}


/* ==================================================
   SOUND
================================================== */

function sound(type){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        oscillator.connect(gain);

        gain.connect(audio.destination);


        if(type==="correct"){

            oscillator.frequency.setValueAtTime(
                600,
                audio.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                1000,
                audio.currentTime+.2
            );

        }


        if(type==="wrong"){

            oscillator.frequency.setValueAtTime(
                180,
                audio.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                100,
                audio.currentTime+.2
            );

        }


        gain.gain.setValueAtTime(
            .08,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime+.25
        );


        oscillator.start();

        oscillator.stop(
            audio.currentTime+.25
        );

    }

    catch(e){}

}


/* ==================================================
   DRAG
================================================== */

cards.forEach(card=>{

    card.addEventListener(
        "pointerdown",
        startDrag
    );

});


function startDrag(e){

    if(
        this.classList.contains(
            "matched"
        )
    )
        return;


    draggedCard = this;

    this.classList.add(
        "dragging"
    );


    speak(
        this.dataset.answer
    );


    const rect =
        this.getBoundingClientRect();


    offsetX =
        e.clientX -
        rect.left;

    offsetY =
        e.clientY -
        rect.top;


    this.style.width =
        rect.width+"px";

    this.style.left =
        e.clientX -
        offsetX+"px";

    this.style.top =
        e.clientY -
        offsetY+"px";


    this.setPointerCapture(
        e.pointerId
    );


    this.addEventListener(
        "pointermove",
        moveDrag
    );


    this.addEventListener(
        "pointerup",
        endDrag,
        {once:true}
    );

}


/* ==================================================
   MOVE
================================================== */

function moveDrag(e){

    if(!draggedCard)
        return;


    draggedCard.style.left =
        e.clientX -
        offsetX+"px";


    draggedCard.style.top =
        e.clientY -
        offsetY+"px";


    targets.forEach(target=>{

        const rect =
            target.getBoundingClientRect();


        const inside =
            e.clientX >= rect.left &&
            e.clientX <= rect.right &&
            e.clientY >= rect.top &&
            e.clientY <= rect.bottom;


        target.classList.toggle(
            "active",
            inside
        );

    });

}


/* ==================================================
   END
================================================== */

function endDrag(e){

    const card =
        draggedCard;


    card.removeEventListener(
        "pointermove",
        moveDrag
    );


    const rect =
        card.getBoundingClientRect();


    const x =
        rect.left +
        rect.width/2;


    const y =
        rect.top +
        rect.height/2;


    let targetFound =
        null;


    targets.forEach(target=>{

        const r =
            target.getBoundingClientRect();


        if(
            x>=r.left &&
            x<=r.right &&
            y>=r.top &&
            y<=r.bottom
        ){

            targetFound =
                target;

        }


        target.classList.remove(
            "active"
        );

    });


    if(
        targetFound &&
        targetFound.dataset.answer ===
        card.dataset.answer
    ){

        correctMatch(
            card,
            targetFound
        );

    }

    else{

        wrongMatch(card);

    }


    draggedCard = null;

}


/* ==================================================
   CORRECT
================================================== */

function correctMatch(
    card,
    target
){

    score += 10;

    completed++;


    document
    .getElementById("score")
    .textContent =
        score;


    document
    .getElementById("progress")
    .textContent =
        completed;


    card.classList.remove(
        "dragging"
    );

    card.classList.add(
        "matched"
    );


    target.classList.add(
        "matched"
    );


    drawConnection(
        card,
        target
    );


    sound("correct");


    speak(
        target.dataset.answer +
        ". Great job!"
    );


    showMessage(
        "🎉 Great job!"
    );


    if(completed===10){

        setTimeout(()=>{

            speak(
                "Amazing! You matched all the adjectives!"
            );

            showMessage(
                "🏆 AMAZING!",
                3000
            );

            confetti();

        },700);

    }


    setTimeout(()=>{

        card.style.position =
            "relative";

        card.style.left = "";

        card.style.top = "";

        card.style.width = "";

    },300);

}


/* ==================================================
   CONNECTION LINE
================================================== */

function drawConnection(
    card,
    target
){

    const board =
        document
        .querySelector(".board")
        .getBoundingClientRect();


    const c =
        card.getBoundingClientRect();


    const t =
        target.getBoundingClientRect();


    const x1 =
        c.right -
        board.left;


    const y1 =
        c.top +
        c.height/2 -
        board.top;


    const x2 =
        t.left -
        board.left;


    const y2 =
        t.top +
        t.height/2 -
        board.top;


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "x1",
        x1
    );

    line.setAttribute(
        "y1",
        y1
    );

    line.setAttribute(
        "x2",
        x2
    );

    line.setAttribute(
        "y2",
        y2
    );


    line.classList.add(
        "connection"
    );


    svg.appendChild(
        line
    );

}


/* ==================================================
   WRONG
================================================== */

function wrongMatch(card){

    card.classList.remove(
        "dragging"
    );


    card.animate(
        [
            {transform:"translateX(0)"},
            {transform:"translateX(-10px)"},
            {transform:"translateX(10px)"},
            {transform:"translateX(0)"}
        ],
        {
            duration:400
        }
    );


    sound("wrong");

    speak(
        "Try again!"
    );


    showMessage(
        "💭 Try again!"
    );


    setTimeout(()=>{

        card.style.position =
            "relative";

        card.style.left = "";

        card.style.top = "";

        card.style.width = "";

    },400);

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text,
    duration=900
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.classList.add(
        "show"
    );


    setTimeout(()=>{

        box.classList.remove(
            "show"
        );

    },duration);

}


/* ==================================================
   CONFETTI
================================================== */

function confetti(){

    for(
        let i=0;
        i<40;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() *
            innerWidth+"px";


        piece.style.background =
            `hsl(${Math.random()*360},
            80%,60%)`;


        document.body.appendChild(
            piece
        );


        setTimeout(
            ()=>piece.remove(),
            2000
        );

    }

}

</script>

</body>
