<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjective Match!</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:#b87945;
    color:#4a2c18;
    overflow-x:hidden;
}

header{
    background:#fff8e8;
    text-align:center;
    padding:15px 10px;
    border-bottom:4px solid #8f5a31;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

h1{
    margin:0;
    font-size:clamp(28px,7vw,45px);
}

.subtitle{
    margin:5px 0 10px;
    font-size:18px;
}

.score{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.badge{
    background:white;
    padding:8px 17px;
    border-radius:20px;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

#table{
    min-height:100vh;
    padding:20px;
    background:#ad713e;

    background-image:
    repeating-linear-gradient(
        90deg,
        rgba(80,40,10,.07) 0,
        rgba(80,40,10,.07) 2px,
        transparent 2px,
        transparent 90px
    );
}

.section-title{
    text-align:center;
    color:white;
    font-size:23px;
    font-weight:bold;
    text-shadow:0 2px 3px #43230f;
    margin-bottom:14px;
}

.board{
    position:relative;
    max-width:1150px;
    margin:auto;
    min-height:1200px;
}

#connections{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2;
}

.connection{
    stroke:#6845e8;
    stroke-width:5;
    stroke-linecap:round;
    fill:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));

    stroke-dasharray:800;
    stroke-dashoffset:800;

    animation:drawLine .6s ease forwards;
}

@keyframes drawLine{
    to{
        stroke-dashoffset:0;
    }
}

.flashcards,
.adjectives{
    position:absolute;
    top:0;
    width:285px;
    z-index:5;
}

.flashcards{
    left:0;
}

.adjectives{
    right:0;
}

.column-title{
    text-align:center;
    background:#fff6d5;
    padding:10px;
    border-radius:18px;
    font-weight:bold;
    margin-bottom:12px;
    box-shadow:0 4px 8px rgba(0,0,0,.2);
}

/* FLASHCARDS */

.card{
    width:260px;
    height:105px;

    margin:0 auto 14px;

    background:#fffdf5;

    border:3px solid #d8c8a8;

    border-radius:14px;

    padding:7px;

    box-shadow:
        0 6px 0 #80502e,
        0 10px 15px rgba(40,20,5,.3);

    cursor:grab;

    touch-action:none;
    user-select:none;

    display:flex;
    align-items:center;

    gap:10px;

    position:relative;

    transition:.15s;
}

.card:hover{
    transform:translateY(-3px) rotate(-1deg);
}

.card.dragging{
    position:fixed;
    z-index:10000;

    transform:
        scale(1.08)
        rotate(3deg);

    box-shadow:
        0 20px 30px rgba(0,0,0,.4);
}

.card.matched{
    opacity:.62;
    cursor:default;
}

.photo{
    width:125px;
    height:87px;

    object-fit:cover;

    border-radius:9px;

    background:#ddd;

    pointer-events:none;
}

.card-name{
    font-weight:bold;
    font-size:15px;
    text-align:center;
    flex:1;
}

/* ADJECTIVES */

.adjective{
    width:245px;
    height:75px;

    margin:0 auto 44px;

    background:#fff8df;

    border:4px dashed #876746;

    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:27px;
    font-weight:900;

    box-shadow:
        inset 0 0 0 2px white,
        0 6px 12px rgba(0,0,0,.25);

    transition:.2s;
}

.adjective.active{
    transform:scale(1.07);
    background:#fff09a;
    border-color:#e4a600;
}

.adjective.matched{
    background:#dfffdc;
    border-color:#49a942;
    border-style:solid;
}

/* MESSAGE */

#message{
    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    opacity:0;

    pointer-events:none;

    background:white;

    padding:24px 34px;

    border-radius:25px;

    font-size:30px;
    font-weight:bold;

    text-align:center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);

    z-index:20000;

    transition:.25s;
}

#message.show{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* BUTTON */

.controls{
    text-align:center;
    margin-top:15px;
}

button{
    border:0;

    background:#fff4b5;

    padding:13px 25px;

    border-radius:25px;

    font-size:18px;
    font-weight:bold;

    color:#55331c;

    box-shadow:
        0 5px 0 #80502e;
}

button:active{
    transform:translateY(4px);

    box-shadow:
        0 1px 0 #80502e;
}

/* CONFETTI */

.confetti{
    position:fixed;

    width:10px;
    height:18px;

    top:-20px;

    z-index:30000;

    animation:
        fall 1.3s linear forwards;
}

@keyframes fall{

    to{
        transform:
            translateY(100vh)
            rotate(720deg);

        opacity:0;
    }
}

/* MOBILE */

@media(max-width:800px){

    #table{
        padding:10px;
    }

    .board{
        min-height:1200px;
    }

    .flashcards,
    .adjectives{
        width:47%;
    }

    .card{
        width:100%;
        height:100px;
    }

    .photo{
        width:65px;
        height:82px;
    }

    .card-name{
        font-size:12px;
    }

    .adjective{
        width:100%;
        height:70px;
        margin-bottom:49px;
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>

<h1>🌈 Adjective Match!</h1>

<div class="subtitle">
Drag the real flashcards to the correct adjective.
</div>

<div class="score">

<div class="badge">
⭐ Score:
<span id="score">0</span>
</div>

<div class="badge">
🎯
<span id="progress">0</span> / 10
</div>

</div>

</header>


<div id="table">

<div class="section-title">
🃏 MATCH THE FLASHCARDS!
</div>


<div class="board">

<svg id="connections"></svg>


<!-- =========================
     FLASHCARDS
========================= -->

<div class="flashcards">

<div class="column-title">
📸 FLASHCARDS
</div>


<!-- ELEPHANT -->

class="photo"

data-answer="small">

class="photo"
src="fe4db989-1055-45aa-99b9-7e57bf9dd858.png">

MOUSE
</div>

</div>


<!-- CHEETAH -->

<div class="card"
data-answer="fast">

<img
class="photo"
src="Cheetah_walking_and_looking_at_the_camera.jpg">

CHEETAH
</div>

</div>


<!-- TURTLE -->

<div class="card"

<img
class="photo"
src="Terrapene_carolina_ssp._carolina_-_Eastern_Box_Turtle_(6-01-23)_01.jpg">

<!-- TALL -->

<div class="card"
data-answer="tall">

<img
class="photo"

TALL TREE

<!-- SHORT -->

<div class="card"
data-answer="short">

<img
class="photo"
src="cd86cf7e-ea58-4470-90b8-800e75aae6c9.png">

SHORT
</div>

<!-- HAPPY -->

<div class="card"
data-answer="happy">

<img
class="photo"
src="Happy_Child_(Unsplash).jpg">

<div class="card-name">
HAPPY
</div>

</div>


<!-- SAD -->

<div class="card"
data-answer="sad">

<img
class="photo"
src="Malachite_cat_(MalKat),_sad.png">

<div class="card-name">

</div>

<!-- HOT -->

<div class="card"
data-answer="hot">

data-answer="cold">

<!-- =========================
     ADJECTIVES
========================= -->

<div class="adjectives">

<div class="column-title">
✨ ADJECTIVES
</div>


<div class="adjective"
data-answer="big">
BIG
</div>

<div class="adjective"
data-answer="small">
SMALL
</div>

<div class="adjective"
data-answer="fast">
FAST
</div>

<div class="adjective"
data-answer="slow">
SLOW
</div>

<div class="adjective"
data-answer="tall">
TALL
</div>

<div class="adjective"
data-answer="short">
SHORT
</div>

<div class="adjective"
data-answer="happy">
HAPPY
</div>

<div class="adjective"
data-answer="sad">
SAD
</div>

<div class="adjective"
data-answer="hot">
HOT
</div>

data-answer="cold">
COLD
</div>

</div>

</div>


<div class="controls">

<button onclick="location.reload()">
🔄 Play Again
</button>

</div>

</div>


<div id="message"></div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let completed = 0;

let dragged = null;

let offsetX = 0;

let offsetY = 0;


const cards =
document.querySelectorAll(".card");

const targets =
document.querySelectorAll(".adjective");

const svg =
document.getElementById("connections");


/* =========================
   VOICE
========================= */

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";

    voice.rate = .85;

    voice.pitch = 1.08;

    speechSynthesis.speak(voice);
}


/* =========================
   GAME SOUNDS
========================= */

function playSound(type){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        oscillator.connect(gain);

        gain.connect(audio.destination);


        if(type === "grab"){

            oscillator.frequency.value = 500;

            gain.gain.value = .04;

            oscillator.start();

            oscillator.stop(
                audio.currentTime + .08
            );

        }


        if(type === "correct"){

            oscillator.frequency.setValueAtTime(
                600,
                audio.currentTime
            );

            oscillator.frequency.setValueAtTime(
                800,
                audio.currentTime + .10
            );

            oscillator.frequency.setValueAtTime(
                1000,
                audio.currentTime + .20
            );

            gain.gain.value = .08;

            oscillator.start();

            oscillator.stop(
                audio.currentTime + .30
            );

        }


        if(type === "wrong"){

            oscillator.frequency.setValueAtTime(
                220,
                audio.currentTime
            );

            oscillator.frequency.setValueAtTime(
                150,
                audio.currentTime + .12
            );

            gain.gain.value = .07;

            oscillator.start();

            oscillator.stop(
                audio.currentTime + .20
            );

        }


        if(type === "finish"){

            oscillator.frequency.setValueAtTime(
                700,
                audio.currentTime
            );

            oscillator.frequency.setValueAtTime(
                900,
                audio.currentTime + .12
            );

            oscillator.frequency.setValueAtTime(
                1100,
                audio.currentTime + .24
            );

            oscillator.frequency.setValueAtTime(
                1300,
                audio.currentTime + .36
            );

            gain.gain.value = .09;

            oscillator.start();

            oscillator.stop(
                audio.currentTime + .5
            );

        }

    }catch(error){

        console.log("Sound unavailable");

    }
}


/* =========================
   START DRAG
========================= */

function startDrag(event){

    if(
        this.classList.contains("matched")
    )
        return;


    dragged = this;

    dragged.classList.add("dragging");


    playSound("grab");


    speak(
        this
        .querySelector(".card-name")
        .textContent
    );


    const rect =
        this.getBoundingClientRect();


    offsetX =
        event.clientX - rect.left;

    offsetY =
        event.clientY - rect.top;


    this.style.width =
        rect.width + "px";


    this.style.left =
        event.clientX -
        offsetX + "px";


    this.style.top =
        event.clientY -
        offsetY + "px";


    this.setPointerCapture(
        event.pointerId
    );


    this.addEventListener(
        "pointermove",
        moveDrag
    );


    this.addEventListener(
        "pointerup",
        endDrag,
        {once:true}
    );
}


/* =========================
   MOVE
========================= */

function moveDrag(event){

    if(!dragged)
        return;


    dragged.style.left =
        event.clientX -
        offsetX + "px";


    dragged.style.top =
        event.clientY -
        offsetY + "px";


    targets.forEach(target=>{

        const rect =
            target.getBoundingClientRect();


        const inside =
            event.clientX >= rect.left &&
            event.clientX <= rect.right &&
            event.clientY >= rect.top &&
            event.clientY <= rect.bottom;


        target.classList.toggle(
            "active",
            inside
        );

    });

}


/* =========================
   END DRAG
========================= */

function endDrag(event){

    const card =
        dragged;


    card.removeEventListener(
        "pointermove",
        moveDrag
    );


    const rect =
        card.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let targetFound = null;


    targets.forEach(target=>{

        const targetRect =
            target.getBoundingClientRect();


        if(
            centerX >= targetRect.left &&
            centerX <= targetRect.right &&
            centerY >= targetRect.top &&
            centerY <= targetRect.bottom
        ){

            targetFound =
                target;

        }


        target.classList.remove(
            "active"
        );

    });


    if(
        targetFound &&
        targetFound.dataset.answer ===
        card.dataset.answer
    ){

        correctMatch(
            card,
            targetFound
        );

    }else{

        wrongMatch(card);

    }


    dragged = null;
}


/* =========================
   CORRECT MATCH
========================= */

function correctMatch(
    card,
    target
){

    score += 10;

    completed++;


    document
    .getElementById("score")
    .textContent =
        score;


    document
    .getElementById("progress")
    .textContent =
        completed;


    card.classList.remove(
        "dragging"
    );

    card.classList.add(
        "matched"
    );


    target.classList.add(
        "matched"
    );


    drawConnection(
        card,
        target
    );


    playSound("correct");


    speak(
        target.dataset.answer +
        ". Great job!"
    );


    showMessage(
        "🎉 Great job!"
    );


    resetCard(card);


    if(completed === 10){

        setTimeout(()=>{

            playSound("finish");

            speak(
                "Amazing! You matched all the adjectives!"
            );


            showMessage(
                "🏆 AMAZING!",
                3000
            );


            createConfetti();

        },800);

    }

}


/* =========================
   DRAW CONNECTION
========================= */

function drawConnection(
    card,
    target
){

    const board =
        document
        .querySelector(".board")
        .getBoundingClientRect();


    const cardRect =
        card.getBoundingClientRect();


    const targetRect =
        target.getBoundingClientRect();


    const x1 =
        cardRect.right -
        board.left;


    const y1 =
        cardRect.top +
        cardRect.height / 2 -
        board.top;


    const x2 =
        targetRect.left -
        board.left;


    const y2 =
        targetRect.top +
        targetRect.height / 2 -
        board.top;


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "x1",
        x1
    );

    line.setAttribute(
        "y1",
        y1
    );

    line.setAttribute(
        "x2",
        x2
    );

    line.setAttribute(
        "y2",
        y2
    );


    line.classList.add(
        "connection"
    );


    svg.appendChild(
        line
    );

}


/* =========================
   WRONG MATCH
========================= */

function wrongMatch(card){

    playSound("wrong");


    speak(
        "Try again!"
    );


    showMessage(
        "💭 Try again!"
    );


    card.animate(

        [
            {
                transform:
                "translateX(0)"
            },

            {
                transform:
                "translateX(-10px)"
            },

            {
                transform:
                "translateX(10px)"
            },

            {
                transform:
                "translateX(0)"
            }

        ],

        {
            duration:400
        }

    );


    resetCard(card);
}


/* =========================
   RESET CARD
========================= */

function resetCard(card){

    setTimeout(()=>{

        card.style.position =
            "relative";

        card.style.left = "";

        card.style.top = "";

        card.style.width = "";

    },400);

}


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    duration = 900
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    setTimeout(()=>{

        message.classList.remove(
            "show"
        );

    },duration);

}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

    for(
        let i = 0;
        i < 50;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() *
            window.innerWidth +
            "px";


        piece.style.background =
            `hsl(
                ${Math.random()*360},
                80%,
                60%
            )`;


        document.body.appendChild(
            piece
        );


        setTimeout(()=>{

            piece.remove();

        },2000);

    }

}


/* =========================
   ACTIVATE CARDS
========================= */

cards.forEach(card=>{

    card.addEventListener(
        "pointerdown",
        startDrag
    );

});

</script>

</body>
</html>
